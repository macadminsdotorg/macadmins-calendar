name: Community Event Submission
description: Suggest a conference, meetup, or community event for the Mac Admins calendar.
title: "[Event] "
labels: ["event-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an event for the [Community Calendar](https://macadmins.org/calendar/)!

        A Mac Admins Foundation volunteer will review it. Good fits are **broadly relevant to the Mac admin community, offer high-quality technical or professional content, are live (in person or virtual), and welcome all attendees.** Sales pitches, invite-only events, and pre-recorded events aren't a fit.

        **Want to see how it will look first?** Fill in the form at [macadmins.org/calendar/submit](https://macadmins.org/calendar/submit/) instead. It shows a preview of your event and brings your answers back here.
  - type: input
    id: name
    attributes:
      label: Event name
      description: |
        The title shown everywhere on the calendar. Include your group's name so it makes sense on its own, and leave the date out (we show it separately).
      placeholder: e.g. Greater Philadelphia Mac Admins Meetup
    validations:
      required: true
  - type: input
    id: organizer
    attributes:
      label: Organizing group (optional)
      description: The user group, company, or organization that runs the event. Leave blank if the event name already says it.
      placeholder: e.g. Greater Philadelphia Mac Admins
  - type: dropdown
    id: type
    attributes:
      label: Event type
      description: Pick Meetup for user group meetings.
      options:
        - Meetup
        - Conference
        - Workshop
        - Webinar
    validations:
      required: true
  - type: input
    id: start_date
    attributes:
      label: Date
      description: Format YYYY-MM-DD. For a multi-day event, this is the first day.
      placeholder: "2026-11-24"
    validations:
      required: true
  - type: input
    id: end_date
    attributes:
      label: End date (multi-day events only)
      description: Format YYYY-MM-DD. Leave blank for a one-day event.
      placeholder: "2026-11-26"
  - type: input
    id: location
    attributes:
      label: Location
      description: |
        City, then state or province if your country uses them, then country. No street addresses or venue names. Write "Online" for a virtual event.
        Examples: `Philadelphia, PA, USA` · `Brighton, UK` · `Tokyo, Japan` · `Online`
      placeholder: "Philadelphia, PA, USA"
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Event website or sign-up page
      placeholder: https://
    validations:
      required: true
  - type: input
    id: videos
    attributes:
      label: Recordings (optional)
      description: Link to a channel or playlist where past talks are published.
      placeholder: https://
  - type: dropdown
    id: language
    attributes:
      label: Event language (optional)
      description: Only pick one if the event is **not** in English. Leave blank for English-language events.
      options:
        - Arabic
        - Chinese
        - Czech
        - Danish
        - Dutch
        - Finnish
        - French
        - German
        - Hindi
        - Hungarian
        - Italian
        - Japanese
        - Korean
        - Norwegian
        - Polish
        - Portuguese
        - Russian
        - Spanish
        - Swedish
  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      description: Extra context for the reviewer, or how you're connected to the event. This isn't shown on the calendar.
  - type: checkboxes
    id: eligibility
    attributes:
      label: Eligibility
      options:
        - label: This event is relevant to the Mac admin community and welcomes all attendees — it isn't a sales pitch, invite-only, or pre-recorded.
          required: true
