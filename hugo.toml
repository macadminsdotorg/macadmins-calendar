# baseURL will be overridden by GitHub Actions for production
# For local development: baseURL = 'http://localhost:1313'
# For GitHub Pages: baseURL = 'https://homebysix.github.io/macadmins-calendar'
baseURL = 'http://localhost:1313'
languageCode = 'en-us'
title = 'Mac Admin Conferences Calendar'
theme = 'macadmin-calendar'
disableKinds = ['taxonomy', 'term']

[params]
  description = 'A comprehensive calendar of Mac Admin conferences, meetups, and events worldwide'
  author = 'Elliot Jordan'
  highlightColor = '#007bff'
  highlightHover = '#0056b3'
  highlightLight = '#d4edda'
  highlightText = '#155724'
  highlightColorDark = '#58a6ff'
  highlightHoverDark = '#79b8ff'
  highlightLightDark = '#1f3a2a'
  highlightTextDark = '#7ee0a4'
  # The submit page sends finished submissions to this issue form.
  submitIssueURL = 'https://github.com/macadminsdotorg/macadmins-calendar/issues/new'
  submitIssueTemplate = 'event-submission.yml'
  submitSlackURL = 'https://macadmins.slack.com/archives/C03G27DCDC4'

[[menu.main]]
  name = 'Events List'
  url = '/events/'
  weight = 10

[[menu.main]]
  name = 'Calendar'
  url = '/calendar/'
  weight = 20

[[menu.main]]
  name = 'Submit an Event'
  url = '/submit/'
  weight = 25

[[menu.main]]
  name = 'About'
  url = '/about/'
  weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[mediaTypes."text/calendar"]
  suffixes = ["ics"]

[outputFormats.ics]
  mediaType = "text/calendar"
  baseName = "events"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "ics"]
