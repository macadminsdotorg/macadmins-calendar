name: Trigger site deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/events.yaml"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Mint app installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # Org-owned GitHub App with Contents: read/write on the site repo
          # (required for repository_dispatch).
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: macadminsdotorg
          repositories: macadminsdotorg
      - name: Dispatch calendar-updated to macadminsdotorg
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api -X POST repos/macadminsdotorg/macadminsdotorg/dispatches \
            -f event_type=calendar-updated
