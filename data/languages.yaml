# ISO 639-1 language codes to display names mapping
# Keys are quoted because YAML 1.1 parsers (including PyYAML, used by
# scripts/validate_events.py) read an unquoted `no` as the boolean false.
# All keys are quoted for consistency; keep new entries quoted too.
languages:
  "ar": "Arabic"
  "cs": "Czech"
  "da": "Danish"
  "de": "German"
  "en": "English"
  "es": "Spanish"
  "fi": "Finnish"
  "fr": "French"
  "hi": "Hindi"
  "hu": "Hungarian"
  "it": "Italian"
  "ja": "Japanese"
  "ko": "Korean"
  "nl": "Dutch"
  "no": "Norwegian"
  "pl": "Polish"
  "pt": "Portuguese"
  "ru": "Russian"
  "sv": "Swedish"
  "zh": "Chinese"
