name: Validate events.yaml

# No path filter. The job takes about six seconds, and every filtered list is
# a gap waiting to open: validate_events.py grew a dependency on
# data/languages.yaml and the issue form's LANGUAGE_MAP lives in
# scripts/issue_to_event.py, neither of which the old filter watched — so a
# pull request adding a language skipped the very check meant to catch a bad
# one. Running it on everything costs nothing and cannot drift.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: python scripts/validate_events.py
