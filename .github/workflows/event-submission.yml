name: Convert approved event submission to PR

on:
  issues:
    types: [labeled]

jobs:
  create-pr:
    # Fires when a volunteer adds the "approved" label to an event submission.
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'event-submission')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - name: Add event to events.yaml
        id: convert
        env:
          # Untrusted input: only ever passed via environment, never
          # interpolated into run steps.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/issue_to_event.py
      - name: Validate
        id: validate
        run: |
          if python scripts/validate_events.py 2> "$RUNNER_TEMP/validate.txt"; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Send back a submission that fails validation
        if: steps.validate.outputs.result == 'failed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          {
            echo "This submission didn't pass validation, so no pull request was opened:"
            echo
            echo '```'
            grep -v '^$' "$RUNNER_TEMP/validate.txt"
            echo '```'
            echo
            echo "Edit the issue to fix it (the preview comment will update), then add the \`approved\` label again."
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label approved
          exit 1
      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          branch: event-submission/issue-${{ github.event.issue.number }}
          title: "Add event: ${{ steps.convert.outputs.name }}"
          commit-message: "Add event: ${{ steps.convert.outputs.name }} (#${{ github.event.issue.number }})"
          body: |
            Adds **${{ steps.convert.outputs.name }}** to the calendar, submitted in #${{ github.event.issue.number }}.

            `validate_events.py` passed.

            Closes #${{ github.event.issue.number }}
          delete-branch: true
      - name: Report a submission that couldn't be converted
        if: failure() && steps.convert.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "This submission couldn't be converted (a required field is missing, or the event is already on the calendar). See the preview comment above, or the run log: $RUN_URL. Fix the issue, then add the \`approved\` label again."
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label approved
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --reason completed \
            --comment "Thanks! This submission has been approved and converted to a pull request: $PR_URL — the event will appear on the calendar once it merges."
